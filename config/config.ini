[APPLICATION]
app_name = Parquet Retention Agent
version = 1.0.0

[DATABASE]
db_path = data/retention_agent.db

[LOGGING]
log_directory = logs
log_level = INFO

[REPORT]
report_directory = reports

[CSV]
retention_date_column = retention_date
parquet_path_column = parquet_file_path
application_column = application_name
table_column = table_name
filename_column = parquet_file_name

[LOCK]
lock_file = data/retention.lock

[DIRECTORIES]
archive_directory = processed